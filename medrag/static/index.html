<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>medrag</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #9aa2af;
    --accent: #5b8cff;
    --warn: #e0a030;
    --err: #e05a5a;
    --ok: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 24px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
  }
  textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    background: #0d0f13;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  select, input[type=number] {
    background: #0d0f13;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    font-size: 12px;
  }
  .status-badge {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid currentColor;
  }
  .status-answered { color: var(--ok); }
  .status-not_found, .status-truncated { color: var(--warn); }
  .status-refused, .status-error { color: var(--err); }
  .answer-text { white-space: pre-wrap; margin-top: 12px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  a { color: var(--accent); text-decoration: none; }
  .warn-box, .err-box {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
  }
  .warn-box { background: rgba(224, 160, 48, 0.1); border: 1px solid var(--warn); color: var(--warn); }
  .err-box { background: rgba(224, 90, 90, 0.1); border: 1px solid var(--err); color: var(--err); }
  .quote { border-left: 2px solid var(--border); padding-left: 10px; margin: 8px 0; color: var(--muted); font-size: 13px; }
  .disclaimer { font-size: 12px; color: var(--muted); margin-top: 18px; text-align: center; }
  .doctor-list { font-size: 13px; }
  .doctor-row { display: flex; gap: 8px; padding: 4px 0; align-items: baseline; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 4px; }
  .dot.ok { background: var(--ok); }
  .dot.fail { background: var(--err); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>medrag</h1>
  <p>Local-first, evidence-citing literature Q&amp;A. Research support only — never clinical advice.</p>
</header>
<main>
  <div class="panel">
    <textarea id="question" placeholder="Ask a question about the indexed literature..."></textarea>
    <div class="row">
      <label>Provider
        <select id="provider">
          <option value="ollama">ollama (local)</option>
          <option value="anthropic">anthropic (cloud)</option>
        </select>
      </label>
      <label>Top-K <input id="topK" type="number" value="6" min="1" max="20" style="width:60px" /></label>
      <label><input id="showEvidence" type="checkbox" /> Show evidence quotes</label>
      <label id="phiLabel" style="display:none"><input id="iConfirmNoPhi" type="checkbox" /> I confirm this question has no patient data</label>
      <button id="askBtn">Ask</button>
    </div>
  </div>

  <div class="panel" id="result" style="display:none"></div>

  <details class="panel">
    <summary>Setup status (medrag doctor)</summary>
    <div id="doctor" class="doctor-list" style="margin-top:10px">Loading...</div>
  </details>

  <p class="disclaimer">Answers cite PMIDs from retrieved PubMed abstracts only. Always verify against the source papers.</p>
</main>

<script>
const providerSel = document.getElementById('provider');
const phiLabel = document.getElementById('phiLabel');
providerSel.addEventListener('change', () => {
  phiLabel.style.display = providerSel.value === 'anthropic' ? 'flex' : 'none';
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function linkifyCitations(text) {
  return escapeHtml(text).replace(/\[PMID:(\d+)\]/g, (m, pmid) =>
    `<a href="https://pubmed.ncbi.nlm.nih.gov/${pmid}/" target="_blank" rel="noopener">${m}</a>`
  );
}

async function loadDoctor() {
  const el = document.getElementById('doctor');
  try {
    const resp = await fetch('/api/doctor');
    const data = await resp.json();
    el.innerHTML = data.checks.map(c => `
      <div class="doctor-row">
        <div class="dot ${c.ok ? 'ok' : 'fail'}"></div>
        <div><strong>${escapeHtml(c.name)}</strong><br><span style="color:var(--muted)">${escapeHtml(c.detail)}</span></div>
      </div>
    `).join('');
  } catch (e) {
    el.textContent = 'Could not reach medrag API: ' + e;
  }
}
loadDoctor();

const askBtn = document.getElementById('askBtn');
const resultEl = document.getElementById('result');

askBtn.addEventListener('click', async () => {
  const question = document.getElementById('question').value.trim();
  if (!question) return;

  askBtn.disabled = true;
  resultEl.style.display = 'block';
  resultEl.innerHTML = '<span class="spinner"></span> Retrieving evidence and asking the model...';

  const payload = {
    question,
    provider: providerSel.value,
    top_k: parseInt(document.getElementById('topK').value, 10) || 6,
    show_evidence: document.getElementById('showEvidence').checked,
    i_confirm_no_phi: document.getElementById('iConfirmNoPhi').checked,
  };

  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    render(data);
  } catch (e) {
    resultEl.innerHTML = `<div class="err-box">Request failed: ${escapeHtml(String(e))}</div>`;
  } finally {
    askBtn.disabled = false;
  }
});

function render(data) {
  let html = `<span class="status-badge status-${data.status}">${data.status}</span>`;
  if (data.provider) {
    html += ` <span class="meta">provider=${escapeHtml(data.provider)}${data.model ? ' model=' + escapeHtml(data.model) : ''}${data.seconds ? ' (' + data.seconds.toFixed(1) + 's)' : ''}</span>`;
  }

  if (data.error) {
    html += `<div class="err-box">${escapeHtml(data.error)}</div>`;
  }

  if (data.text) {
    html += `<div class="answer-text">${linkifyCitations(data.text)}</div>`;
  }

  if (data.warnings && data.warnings.length) {
    html += `<div class="warn-box"><strong>Warnings:</strong><ul>${data.warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('')}</ul></div>`;
  }

  if (data.topic_spread_warning) {
    html += `<div class="warn-box"><strong>Note:</strong> ${escapeHtml(data.topic_spread_warning)}</div>`;
  }

  if (data.sources && data.sources.length) {
    html += `<table><thead><tr><th>PMID</th><th>Title</th><th>Year</th><th>Type</th><th>Cited</th></tr></thead><tbody>`;
    for (const s of data.sources) {
      html += `<tr><td><a href="${s.url}" target="_blank" rel="noopener">${escapeHtml(s.pmid)}</a></td><td>${escapeHtml(s.title)}</td><td>${s.year ?? 'n.d.'}</td><td>${escapeHtml((s.pub_types || []).join(', ') || 'Unknown')}</td><td>${s.cited ? 'yes' : ''}</td></tr>`;
    }
    html += `</tbody></table>`;
  }

  if (data.evidence && data.evidence.length) {
    html += `<div style="margin-top:12px"><strong>Evidence quotes</strong>`;
    for (const e of data.evidence) {
      html += `<div class="quote">PMID:${escapeHtml(e.pmid)} — "${escapeHtml(e.quote)}"</div>`;
    }
    html += `</div>`;
  }

  if (data.usage) {
    html += `<div class="meta" style="margin-top:8px">Tokens: input=${data.usage.input_tokens ?? '-'} output=${data.usage.output_tokens ?? '-'} cache_creation=${data.usage.cache_creation_input_tokens ?? '-'} cache_read=${data.usage.cache_read_input_tokens ?? '-'}</div>`;
  }
  if (data.estimated_cost_usd != null) {
    html += `<div class="meta">Estimated cost: $${data.estimated_cost_usd.toFixed(4)}</div>`;
  }

  resultEl.innerHTML = html;
}
</script>
</body>
</html>
